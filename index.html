<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Social Hub - Connect, Share & Discover</title>
    <meta name="title" content="Social Hub - Connect, Share & Discover" />
    <meta name="description" content="Join Social Hub, the modern social networking platform. Connect with friends, share moments, discover new people, and build meaningful relationships." />
    <meta name="keywords" content="social media, social network, connect with friends, share photos, messaging, discover people, community, social platform" />
    <meta name="author" content="Social Hub" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://socialhub.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="msapplication-TileColor" content="#3b82f6" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://socialhub.app/" />
    <meta property="og:title" content="Social Hub - Connect, Share & Discover" />
    <meta property="og:description" content="Join Social Hub, the modern social networking platform. Connect with friends, share moments, discover new people, and build meaningful relationships." />
    <meta property="og:image" content="https://socialhub.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Social Hub" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://socialhub.app/" />
    <meta name="twitter:title" content="Social Hub - Connect, Share & Discover" />
    <meta name="twitter:description" content="Join Social Hub, the modern social networking platform. Connect with friends, share moments, discover new people, and build meaningful relationships." />
    <meta name="twitter:image" content="https://socialhub.app/og-image.png" />
    <meta name="twitter:site" content="@socialhub" />
    <meta name="twitter:creator" content="@socialhub" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Social Hub",
      "url": "https://socialhub.app/",
      "description": "Modern social networking platform for connecting with friends and discovering new people",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://socialhub.app/discover?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data - Software Application -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Social Hub",
      "applicationCategory": "SocialNetworking",
      "operatingSystem": "Web",
      "description": "Connect with friends, share moments, and discover new people on Social Hub",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "12500"
      }
    }
    </script>

    <!-- Structured Data - BreadcrumbList -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": "https://socialhub.app/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": "Feed",
          "item": "https://socialhub.app/feed"
        },
        {
          "@type": "ListItem",
          "position": 3,
          "name": "Discover",
          "item": "https://socialhub.app/discover"
        }
      ]
    }
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
